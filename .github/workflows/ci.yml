name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest com shell bash: o histórico de bugs do repo é
        # majoritariamente Windows (python3 no Git Bash, path com espaço,
        # wrapper SQLcl) e nenhum CI cobria o ambiente
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # windows-latest: 3 falhas Windows-only sob investigação (sparse-checkout
    # não sincroniza a working tree do worktree QA; --update não poda skill
    # removida do central; format-*.sh dão exit 127 sob PATH stubado no teste —
    # suspeita de 'ln -sf' virando cópia sem modo desenvolvedor). Não bloqueia
    # merge/tag enquanto isso não é depurado numa máquina Windows real; ubuntu/
    # macos continuam bloqueantes. Remover este continue-on-error quando as 3
    # causas estiverem corrigidas e confirmadas verdes.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: git identity (necessária pros fixtures de teste)
        shell: bash
        run: |
          git config --global user.email "ci@kiro-ai-team.local"
          git config --global user.name "kiro-ai-team CI"
      - name: selftest.sh (sintaxe, JSON, frontmatter, links, gates, install, worktree, hooks, exemplos)
        shell: bash
        run: bash selftest.sh

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (bash -n só pega sintaxe; -S warning porque os bugs P0/P1 do histórico eram exatamente quoting/array que 'error' deixa passar)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh selftest.sh scripts/*.sh skills/*/scripts/*.sh hooks/scripts/*.sh tests/*.sh

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR que muda comportamento precisa bumpar VERSION + CHANGELOG
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          # só docs/exemplos/CI/processo mudaram? bump dispensado
          if git diff --name-only "$BASE"...HEAD | grep -qvE '^(docs/|examples/|\.github/|README\.md|OPERACAO\.md|CHANGELOG\.md|VERSION|LICENSE|CONTRIBUTING\.md|SECURITY\.md|mcp/README\.md|hooks/VERIFY\.md)'; then
            if git diff --quiet "$BASE"...HEAD -- VERSION; then
              echo "::error::mudança de comportamento sem bump de VERSION (e entrada no CHANGELOG)"; exit 1
            fi
            git diff --quiet "$BASE"...HEAD -- CHANGELOG.md && { echo "::error::VERSION bumpada sem entrada no CHANGELOG.md"; exit 1; } || true
          else
            echo "só docs/CI — bump dispensado"
          fi
